name: B2B-Center
description: >-
  B2B-Center is one of Russia's largest electronic trading platforms (ETP) for
  business-to-business procurement, operating at b2b-center.ru. The platform
  hosts electronic tenders, auctions, and competitive sourcing procedures that
  connect corporate and commercial buyers with a broad network of suppliers
  across many industries. It provides tools for organizing purchases, publishing
  procurement notices, qualifying and managing suppliers, and running the full
  electronic bidding lifecycle. B2B-Center is backed by Insight Partners and is
  tracked in the API Evangelist network as a portfolio company awaiting deeper
  enrichment.
